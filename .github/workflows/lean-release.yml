name: Lean release

on:
  push:
    branches: [lean-ci]
    tags: ['lean-v*']

permissions:
  contents: read

concurrency:
  group: lean-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.platform }} arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: linux
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Check packaging logic
        run: |
          for script in lean/ci/bundle-macos.sh lean/ci/bundle-linux.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s lean/ci -p '*_tests.py'

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
          protoc --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev \
            libfreetype-dev libexpat1-dev libgit2-dev libfontconfig1-dev \
            libclang-dev protobuf-compiler libegl1 libwayland-client0 libwayland-egl1 \
            libx11-6 libxcb1 libxcursor1 libxi6 libxkbcommon-x11-0
          protoc --version

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: lean-release-${{ matrix.platform }}-arm64
          cache-on-failure: true
          save-if: ${{ github.ref_type == 'branch' }}

      - name: Install license attribution tool
        run: script/install_cargo_release_deps --no-build-deps

      - name: Build production lean binary
        id: build
        run: |
          binary="$(bash lean/build.sh)"
          test -x "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Bundle and inspect
        env:
          GIT_RELEASE_TAG: ${{ github.ref_name }}
          BINARY: ${{ steps.build.outputs.binary }}
          PLATFORM: ${{ matrix.platform }}
        run: bash "lean/ci/bundle-$PLATFORM.sh" "$BINARY" dist

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warper-${{ matrix.platform }}-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    name: Draft tagged release
    if: startsWith(github.ref, 'refs/tags/lean-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: warper-*
          path: dist
          merge-multiple: true
      - name: Create draft with packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --draft --title "$TAG" \
            --notes 'Warper arm64 builds. macOS is ad-hoc signed and not notarized. See lean/ci/README.md for installation and verification limits.'
